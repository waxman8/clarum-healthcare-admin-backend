name: Enforce Pull Requests
on:
  push:
    branches:
      - main

jobs:
  reject-direct-push:
    runs-on: ubuntu-latest
    steps:
      - name: Block Direct Commit
        run: |
          echo "FAIL: Direct commits to main are blocked!"
          echo "Please create a new branch and open a Pull Request instead."
          echo "--------------------------------------------------------"
          echo "OFFENDER DETAILS:"
          echo "User: ${{ github.actor }}"
          echo "Commit: ${{ github.sha }}"
          echo "Message: ${{ github.event.head_commit.message }}"
          echo "Time: ${{ github.event.head_commit.timestamp }}"
          echo "Compare URL: ${{ github.event.compare }}"
          echo "--------------------------------------------------------"
          exit 1
