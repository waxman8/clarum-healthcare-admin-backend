name: Python Test Suite

on:
  pull_request:
    branches: [ main ] # Change to your default branch name

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12' # Match your project's Python version
          cache: 'pip'           # Speeds up subsequent runs by caching dependencies

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest # Ensures pytest is installed even if not in requirements

      - name: Run Tests with Pytest
        run: |
          pytest
